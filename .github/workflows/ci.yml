name: CI

on:
  push:
    branches: ["*"]

  pull_request:
    branches: ["main"]

  schedule:
    # Weekly safety sweep.
    # GitHub cron uses UTC.
    - cron: "0 5 * * 0"

  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: Test and Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      # Every collection created by this matrix job MUST start with this.
      #
      # Examples:
      # ci-123456-3.10_test_facts_abc123
      # ci-123456-3.11_test_prefs_def456
      #
      # This prevents concurrent matrix jobs from touching each other's data.
      QDRANT_TEST_NAMESPACE: ci-${{ github.run_id }}-${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Qdrant Cloud connectivity
        run: |
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::error ::QDRANT_URL or QDRANT_API_KEY secret is not set."
            exit 1
          fi

          if ! curl -fsS --max-time 10 \
              -H "api-key: $QDRANT_API_KEY" \
              "$QDRANT_URL/collections" > /dev/null; then
            echo "::error ::Could not reach Qdrant Cloud."
            exit 1
          fi

          echo "Qdrant Cloud is reachable."

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,saas]'

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Ruff format (warn only)
        run: |
          if ! ruff format . --check; then
            echo "::warning ::Some files would be reformatted by Ruff"
          fi

      - name: Bandit Security Scan
        run: |
          pip install bandit
          if ! bandit -r src -lll; then
            echo "::warning ::Bandit found potential security issues (review above)"
          fi

      - name: Run unit tests
        run: |
          pytest tests/ -m "not integration" -x --timeout=60 -q
        env:
          REDIS_URL: redis://localhost:6379
          AUTH_ENABLED: "false"
          USER_AUTH_ENABLED: "false"

      # First layer of protection:
      # Clean everything belonging to THIS matrix job.
      - name: Clean up this job's Qdrant collections
        if: always()
        run: |
          python scripts/cleanup_qdrant_test_collections.py

      # Make leaked collections obvious in the Actions log.
      - name: Verify this job's Qdrant collections were deleted
        if: always()
        run: |
          python scripts/cleanup_qdrant_test_collections.py --verify


  # ---------------------------------------------------------------------------
  # SECOND CLEANUP LAYER
  #
  # Runs after every Python matrix job has finished.
  #
  # This catches collections that may have survived fixture teardown or the
  # individual job cleanup.
  # ---------------------------------------------------------------------------

  qdrant-cleanup:
    name: Final Qdrant Cleanup
    runs-on: ubuntu-latest

    needs: [test]

    # Run even when tests fail.
    if: always()

    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

      # Delete collections belonging to ANY Python version from this run.
      QDRANT_RUN_PREFIX: ci-${{ github.run_id }}-

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Qdrant client
        run: |
          python -m pip install --upgrade pip
          pip install qdrant-client

      - name: Delete remaining collections from this workflow run
        run: |
          python scripts/cleanup_qdrant_test_collections.py --run

      - name: Verify workflow collections were deleted
        run: |
          python scripts/cleanup_qdrant_test_collections.py --run --verify

      # On the scheduled Sunday workflow perform an additional garbage
      # collection pass for legacy test collections left behind by old,
      # cancelled, or crashed workflow runs.
      #
      # This intentionally only runs on schedule, NOT on every PR/push.
      - name: Remove stale legacy test collections
        if: github.event_name == 'schedule'
        run: |
          python scripts/cleanup_qdrant_test_collections.py --all-stale

      - name: Show remaining CI/test collections
        if: always()
        run: |
          python scripts/cleanup_qdrant_test_collections.py --list


  build:
    name: Build Package
    runs-on: ubuntu-latest

    needs:
      - test
      - qdrant-cleanup

    # Build only when tests actually succeeded.
    if: needs.test.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,api]'

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Validate build with Twine
        run: |
          twine check dist/*
